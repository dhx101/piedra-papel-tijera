<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piedra, papel, tijeras</title>
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
</head>
<body>
    <h1>Piedra, Papel, Tijeras</h1>
    
    <div class="images">
        <!-- Image for computer's choice (initially a question mark) -->
        <img id="computerChoice" src="question.png" alt="Computer choice" />
        <p class="versus">VS</p>
        <!-- Image for player's choice (initially empty) -->
        <img id="playerChoice" src="question.png" alt="Your choice">
    </div>
    
    <!-- Botones -->
    <div class="buttons">
        <div>
            <button id="rock"><img src="rock.png" alt="Piedra"></button>
            <button id="paper"><img src="paper.png" alt="Papel"></button>
            <button id="scissors"><img src="scissors.png" alt="Tijeras"></button>
        </div>
        <button id="play">Seleccionar</button>
    </div>
    
    <!-- Resultados -->
    <div id="result"></div>
</body>
</html>
